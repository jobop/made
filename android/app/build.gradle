// android/app/build.gradle —— 模块构建骨架
// 首次请用 Android Studio 打开 android/ 目录同步，补齐 AGP/SDK 版本。
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jobop.made'
    compileSdk 34

    defaultConfig {
        applicationId "com.jobop.made"
        minSdk 24
        targetSdk 34
        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // SDL2 for Android：提供 SDLActivity 与 libSDL2.so
    implementation 'org.libsdl:app:2.30.0'
}
